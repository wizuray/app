name: Suggest an idea
description: Something you would like Wizuray to do.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Wizuray to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you? What do you do today instead?
