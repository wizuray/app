name: Report a problem
description: Something in Wizuray does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please never post keys, passwords or personal data here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: "1. Open ...\n2. Tap ...\n3. ..."
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings.
  - type: input
    id: device
    attributes:
      label: Device and system version
      placeholder: "Galaxy S23, Android 16"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove names, keys and anything private first.
